services:

  postgres:
    image: postgres:16-alpine
    container_name: safetikeko-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2975
      POSTGRES_DB: safetikeko_bdd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safetikeko-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:2975@postgres:5432/safetikeko_bdd"
      JWT_SECRET: "SUPER_SECRET_KEY"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ../safetikeko-backoffice
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://192.168.56.10:5000/api"
    container_name: safetikeko-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data: